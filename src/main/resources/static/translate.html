<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Translation App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        h1 {
            color: #333;
        }
        label {
            font-weight: bold;
        }
        textarea, select, input[type="submit"], button {
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
        }

        #results {
            margin-top: 30px;
        }

        .output {
            background: #f1f1f1;
            padding: 10px;
            border-left: 4px solid #4CAF50;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<h1>Translation</h1>

<label for="speechSource">Source Language (speech recognition):</label>
<select id="speechSource" name="speechSource">
    <option value="en-US" selected>English (US)</option>
    <option value="fr-FR">French</option>
    <option value="de-DE">German</option>
    <option value="es-ES">Spanish</option>
    <option value="ru-RU">Russian</option>
    <!-- add more languages as needed -->
</select>

<label for="speechTarget">Target Language (translation):</label>
<select id="speechTarget" name="speechTarget">
    <option value="en" selected>English</option>
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="es">Spanish</option>
    <option value="ru">Russian</option>
    <!-- add more languages as needed -->
</select>

<!-- 🎤 Speech Buttons -->
<button id="startBtn">🎙️ Start Recording</button>
<button id="stopBtn" disabled>⏹️ Stop Recording</button>

<h2>Speech to Text</h2>
<div id="speechResult" class="output" style="display:none;">
    <h3>Speech Transcription:</h3>
    <p id="transcriptionText"></p>
</div>


<!-- 🎯 Form -->
<form method="POST" action="http://localhost:8080/api/translate" id="translateForm">
    <label for="text">Text to translate:</label>
    <textarea id="text" name="text" rows="4" required></textarea>

    <label for="source">Source Language (e.g., en):</label>
    <input type="text" id="source" name="source" value="en" required>

    <label for="target">Target Language (e.g., fr):</label>
    <input type="text" id="target" name="target" value="fr" required>


    <input type="submit" value="Translate">
</form>

<div id="results">
    <div id="googleResult" class="output" style="display:none;">
        <h3>Google Translation:</h3>
        <p id="googleText"></p>
    </div>
</div>

<!-- 🎧 JS Logic -->
<script>
    // 🎙️ Voice Recording
    let mediaRecorder;
    let audioChunks = [];

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const textArea = document.getElementById('text');
    const transcriptionText = document.getElementById('transcriptionText');
    const speechSourceSelect = document.getElementById('speechSource');
    const speechTargetSelect = document.getElementById('speechTarget');

    startBtn.addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/flac' });

                // Prepare form data with audio and languages
                const formData = new FormData();
                formData.append('file', audioBlob, 'recording.flac');

                // Send sourceLang (for speech recognition) and targetLang (for translation) to backend
                formData.append('speechSource', speechSourceSelect.value);
                formData.append('speechTarget', speechTargetSelect.value);

                try {
                    const response = await fetch('/api/speech-translate', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error("HTTP error " + response.status);
                    }

                    const json = await response.json();
                    // Expecting { transcription: "...", translation: "..." }
                    transcriptionText.textContent = json.transcription || "No transcription received.";
                    transcriptionText.style.display = 'block';

                    // Also put transcription text into textarea for manual translation/edit if needed
                    textArea.value = json.transcription || "";

                    // Update translate form source and target to keep them in sync
                    document.getElementById('speechSource').value = speechTargetSelect.value; // or json.sourceLang?
                    document.getElementById('speechTarget').value = speechTargetSelect.value;

                    document.getElementById('speechResult').style.display = "block";

                } catch (err) {
                    console.error("Transcription error:", err);
                    alert("Speech-to-text error: " + err.message);
                }
            };

            mediaRecorder.start();
            startBtn.disabled = true;
            stopBtn.disabled = false;
        } catch (err) {
            console.error("Microphone access denied or error:", err);
            alert("Could not start recording: " + err.message);
        }
    });

    stopBtn.addEventListener('click', () => {
        mediaRecorder.stop();
        startBtn.disabled = false;
        stopBtn.disabled = true;
    });

    // document.getElementById("translateForm").addEventListener("submit", async function (e) {
    //     e.preventDefault();



    let debounceTimer;

    textArea.addEventListener("input", () => {
        clearTimeout(debounceTimer);

        debounceTimer = setTimeout(async () => {
            const text = document.getElementById("text").value;
            const source = document.getElementById("source").value;
            const target = document.getElementById("target").value;
            const resultBox = document.getElementById("googleResult");
            const resultText = document.getElementById("googleText");

            if (text.length === 0) {
                resultBox.style.display = "none";
                return;
            }

            try {
                const response = await fetch("/api/translate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams({ text, source, target })
                });

                if (!response.ok) {
                    throw new Error("HTTP error " + response.status);
                }

                const result = await response.json();
                console.log("Backend response:", result);

                const translatedText = result.data.translations[0].translatedText;

                resultText.textContent = translatedText;
                resultBox.style.display = "block";

            } catch (e) {
                console.error("Translation failed:", e);
            }

        }, 500);
    });


</script>
</body>
</html>
